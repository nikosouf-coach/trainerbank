# Supabase CLI – Konfiguration für Trainerstab
# Gilt für die lokale Entwicklung (`supabase start`) und für die Deploy-Einstellungen
# der Edge Functions. Das gehostete Projekt (Region Frankfurt, eu-central-1) wird mit
# `supabase link --project-ref <PROJECT_REF>` verbunden – siehe supabase/README.md.

project_id = "trainerstab"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
# An die Postgres-Version des gehosteten Projekts anpassen (Dashboard → Settings → Infrastructure).
major_version = 17

[auth]
enabled = true
# Website: Ziel der Bestätigungslinks (zeigt „E-Mail bestätigt“); im gehosteten Projekt unter Authentication →
# URL Configuration genauso eintragen.
site_url = "https://trainerstab.app"
# Erlaubte Ziele nach Bestätigung bzw. Passwort-Link: Website, Deep-Link-Schema der App (app.config.ts → scheme) und
# Expo-Web-Dev-Server.
additional_redirect_urls = ["https://trainerstab.app/**", "trainerstab://**", "http://localhost:8081"]
jwt_expiry = 3600
enable_signup = true
# Mindestlänge wie bei der Registrierung in der App. Im gehosteten Projekt zusätzlich im Dashboard setzen
# (Authentication → Providers → Email: Mindestlänge 8, Schutz vor geleakten Passwörtern an) – siehe docs/TOM.md.
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true

# Edge Functions
# ai, finding, delete-account: nur für angemeldete Nutzer. Die Funktionen prüfen das Nutzer-JWT selbst beim
# Auth-Server (authenticate() in _shared/supabase.ts) und antworten sonst mit 401. Die Prüfung der Plattform
# (verify_jwt) ist aus, weil sie mit den neuen JWT-Signaturschlüsseln von Supabase nicht zuverlässig funktioniert
# (Supabase empfiehlt dann, sie abzuschalten und im Code zu prüfen).
# push-reminders: wird von pg_cron ohne JWT aufgerufen und prüft stattdessen den Header x-cron-secret.
# chat-push: wird bei neuen Chat-Nachrichten vom Datenbank-Trigger aufgerufen (ebenfalls x-cron-secret).
# privacy-purge: tägliche Löschfristen mit Dateien im Speicher, von pg_cron/pg_net aufgerufen (ebenfalls x-cron-secret).
[functions.ai]
verify_jwt = false

[functions.finding]
verify_jwt = false

[functions.delete-account]
verify_jwt = false

[functions.push-reminders]
verify_jwt = false

# chat-push: wird vom Datenbank-Trigger (pg_net) ohne JWT aufgerufen und prüft den Header x-cron-secret.
[functions.chat-push]
verify_jwt = false

# privacy-purge: von pg_cron (pg_net) ohne JWT aufgerufen, prüft den Header x-cron-secret.
[functions.privacy-purge]
verify_jwt = false
