# Spielt Datenbank-Migrationen und Edge Functions auf das Supabase-Projekt (Region Frankfurt).
# Läuft automatisch bei Änderungen in supabase/ auf main oder manuell (Actions → Backend deployen → Run workflow).
#
# Benötigte Repository-Secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN   – Supabase-Konto → Access Tokens
#   SUPABASE_PROJECT_REF    – Projekt-ID (Dashboard → Project Settings → General)
#   SUPABASE_DB_PASSWORD    – Datenbank-Passwort des Projekts
#   ANTHROPIC_API_KEY       – Claude API (KI-Coach, Befund-Auswertung)
#   CRON_SECRET             – beliebige lange Zufallszeichenkette (Push-Erinnerungen)
#   EXPO_ACCESS_TOKEN       – optional, nur wenn „Enhanced push security“ bei Expo aktiv ist
name: Backend deployen

on:
  push:
    branches: [main]
    paths: ["supabase/**"]
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: echo "PGBIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)" >> "$GITHUB_ENV"
      - run: bash supabase/tests/run.sh
        env:
          PGTEST_DIR: ${{ runner.temp }}/pgtest

  deploy:
    needs: tests
    runs-on: ubuntu-24.04
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Sind die Schlüssel eingetragen?
        id: check
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$PROJECT_REF" ] && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Supabase-Secrets fehlen noch – Deploy übersprungen (siehe SETUP.md, Schritt 3)."
          fi
      - uses: actions/checkout@v7
        if: steps.check.outputs.ok == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ok == 'true'
        with:
          version: latest
      - name: Projekt verbinden
        if: steps.check.outputs.ok == 'true'
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Migrationen einspielen
        if: steps.check.outputs.ok == 'true'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Secrets der Edge Functions setzen
        if: steps.check.outputs.ok == 'true'
        run: |
          args=()
          [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ] && args+=("ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}")
          [ -n "${{ secrets.CRON_SECRET }}" ] && args+=("CRON_SECRET=${{ secrets.CRON_SECRET }}")
          [ -n "${{ secrets.EXPO_ACCESS_TOKEN }}" ] && args+=("EXPO_ACCESS_TOKEN=${{ secrets.EXPO_ACCESS_TOKEN }}")
          if [ ${#args[@]} -gt 0 ]; then supabase secrets set --project-ref "$PROJECT_REF" "${args[@]}"; fi
      - name: Edge Functions deployen
        if: steps.check.outputs.ok == 'true'
        run: |
          for fn in ai finding delete-account push-reminders; do
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
          done
