# Abhängigkeiten aktuell halten: wöchentlich npm (gebündelt), monatlich GitHub Actions.
# Expo-Pakete werden mit dem SDK gemeinsam aktualisiert (npx expo install --fix) – deshalb ignoriert.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      kleinkram:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "expo*"
      - dependency-name: "eslint-config-expo"
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript und ESLint gibt Expo vor (npx expo install --check); Hauptversionen nur mit dem SDK
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@expo/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native-async-storage/async-storage"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
